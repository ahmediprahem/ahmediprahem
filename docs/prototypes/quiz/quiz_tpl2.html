<title>استبيان زنها التفاعلي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* المفهوم: جوال واحد في المنتصف. الطبق هو شريط التقدم: كل إجابة تملأ قطاعاً منه. بعد الاستبيان يولّد المحرك الحقيقي لزنها برو خطة أسبوع من اختيارات العميل. خلفية فاتحة بتدرّج باستيل وبرتقالي للفعل */
:root{
  --bg:#ffffff;--fg:#101736;--mut:#58618a;--card:#ffffff;--line:rgba(16,23,54,.12);--plate:rgba(16,23,54,.07);
  --accent:#e0540a;--accent-soft:#ffeadb;--on-accent:#ffffff;--ok:#0f8f6b;--ok-soft:#dff5ec;--warn:#a85200;--warn-soft:#fff1d6;--no:#8b92b0;
  --g-pro:#ff7a59;--g-carb:#ffc94d;--g-dairy:#7fb0ff;--g-fruit:#ff8fb1;--g-veg:#3fbf93;--g-fat:#c9a0ff;
  --glow1:#ffd9c2;--glow2:#ddd0ff;--glow3:#c8f2e2;--shadow:0 10px 30px rgba(16,23,54,.10);
  --fd:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;--fb:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1330;--fg:#f2f4ff;--mut:#a9b2d8;--card:#151d4b;--line:rgba(255,255,255,.15);--plate:rgba(255,255,255,.09);
  --accent:#ff8a3c;--accent-soft:#3a2418;--on-accent:#1b0f05;--ok:#5fe0b0;--ok-soft:#12342c;--warn:#ffc46b;--warn-soft:#3a2d12;--no:#7c85ad;
  --glow1:#5a3326;--glow2:#2f2a66;--glow3:#16463c;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1330;--fg:#f2f4ff;--mut:#a9b2d8;--card:#151d4b;--line:rgba(255,255,255,.15);--plate:rgba(255,255,255,.09);
  --accent:#ff8a3c;--accent-soft:#3a2418;--on-accent:#1b0f05;--ok:#5fe0b0;--ok-soft:#12342c;--warn:#ffc46b;--warn-soft:#3a2d12;--no:#7c85ad;
  --glow1:#5a3326;--glow2:#2f2a66;--glow3:#16463c;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.65;direction:rtl}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.app{position:relative;width:100%;max-width:430px;margin:0 auto;min-height:calc(100svh - 24px);display:flex;flex-direction:column;border-radius:30px;border:1px solid var(--line);background:var(--bg);overflow:hidden;box-shadow:var(--shadow)}
.app::before{content:"";position:absolute;inset:0 0 auto 0;height:260px;z-index:0;pointer-events:none;background:radial-gradient(60% 90% at 92% 0,var(--glow1),transparent 72%),radial-gradient(60% 90% at 6% 0,var(--glow2),transparent 72%),radial-gradient(46% 70% at 50% -8%,var(--glow3),transparent 72%)}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);display:grid;place-items:center;flex:none}
.back[disabled]{opacity:.3;cursor:default}.back svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;height:8px;border-radius:8px;background:var(--plate);overflow:hidden}.prog i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ff9a4a,var(--accent));transition:width .5s cubic-bezier(.3,1,.4,1)}
.tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 10px;white-space:nowrap}
.body{position:relative;z-index:1;flex:1;padding:8px 20px 20px;display:flex;flex-direction:column;gap:18px;animation:rise .38s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--fd);margin:0;line-height:1.35;text-wrap:balance}h1{font-size:28px;font-weight:700}h2{font-size:22px;font-weight:700}
.lead{color:var(--mut);margin:0;max-width:36ch}
.cta{position:sticky;bottom:0;z-index:2;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 34%)}
.btn{width:100%;min-height:54px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.plate{display:block;margin:0 auto;filter:drop-shadow(0 8px 14px rgba(16,23,54,.12))}
.plate .rim{fill:var(--card);stroke:var(--line);stroke-width:1.2}.plate .well{fill:var(--plate)}.plate .wb{fill:var(--plate)}
.plate .wf{transform-box:view-box;transform-origin:60px 60px;transform:scale(var(--s,0));transition:transform .65s cubic-bezier(.3,1.35,.5,1)}
.plate .hub{fill:var(--bg);stroke:var(--line)}
.plate.anim .wf{animation:fill 1s cubic-bezier(.3,1.35,.5,1) both}@keyframes fill{from{transform:scale(0)}to{transform:scale(var(--s,1))}}
.hero{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding-top:14px}.hero .lead{margin-inline:auto}
.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.facts span{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:var(--card)}
.q{display:flex;flex-direction:column;gap:6px}.q .lead{font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s,transform .15s}
.opt:active{transform:scale(.98)}.opt b{font-family:var(--fd);font-size:17px}.opt span.d{color:var(--mut);font-size:14px;line-height:1.55}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .sym{width:44px;height:44px;border-radius:14px;background:var(--plate);display:grid;place-items:center;font-size:24px;font-weight:700}
.opt.on .sym{background:var(--accent);color:var(--on-accent)}
.big{display:flex;align-items:baseline;gap:8px}.big b{font-family:var(--fd);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}.big span{color:var(--mut)}
.rng{width:100%;direction:ltr;appearance:none;-webkit-appearance:none;height:8px;border-radius:8px;background:var(--plate);outline-offset:6px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--accent);border:4px solid var(--card);box-shadow:0 2px 8px rgba(16,23,54,.3)}
.rng::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--accent);border:4px solid var(--card)}
.card{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:14.5px;color:var(--mut);margin:0}.note b{color:var(--fg)}
.note.warn{color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px}
.note.ok{color:var(--ok);background:var(--ok-soft);border-radius:12px;padding:8px 12px}
.scale{position:relative;height:56px;margin-top:6px;direction:ltr}
.scale .bar{position:absolute;inset:26px 0 auto;height:12px;border-radius:12px;background:var(--plate)}
.scale .band{position:absolute;top:26px;height:12px;border-radius:12px;background:var(--g-veg);opacity:.85}
.scale .mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;white-space:nowrap}
.scale .mk::after{content:"";width:3px;height:12px;border-radius:3px;background:currentColor;margin-top:2px}
.scale .mk.cur{color:var(--fg)}.scale .mk.tg{color:var(--accent)}
.scale .lbl{position:absolute;top:42px;transform:translateX(-50%);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.meter{display:flex;gap:3px;align-items:flex-end;height:22px}.meter i{width:6px;border-radius:3px;background:var(--plate)}.meter i:nth-child(1){height:30%}.meter i:nth-child(2){height:52%}.meter i:nth-child(3){height:76%}.meter i:nth-child(4){height:100%}.meter i.on{background:var(--accent)}
.row{display:flex;align-items:center;gap:14px}.row>div{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;min-height:44px;font-weight:500;transition:.2s}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.mnames{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.mnames span{font-size:13px;border-radius:99px;padding:2px 12px;background:var(--plate)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:150px;flex:none;direction:ltr}.wk i{height:12px;border-radius:4px}
.badge{font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:1px 10px;align-self:flex-start}
.tip{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px dashed var(--line)}
.tip p{margin:0}.draft{font-size:11px;color:var(--warn);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.cnt{font-size:14px;font-weight:600;color:var(--ok)}.cnt.low{color:var(--warn)}
.sec{display:flex;flex-direction:column;gap:10px}.sec h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}.sec h3 small{font-weight:400;color:var(--mut)}
.srch{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);color:var(--fg);font:inherit}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.food{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:99px;min-height:44px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;transition:.2s;text-align:start}
.food .e{font-size:20px;line-height:1}.food:active{transform:scale(.96)}
.food .st{font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;display:none}
.food.love{border-color:var(--ok);background:var(--ok-soft)}.food.love .st{display:inline;background:var(--ok);color:var(--bg)}
.food.no{opacity:.55;border-style:dashed}.food.no .n{text-decoration:line-through}.food.no .st{display:inline;background:var(--no);color:var(--bg)}
.food.more{display:none}.fl.all .food.more{display:flex}.food.hid{display:none!important}
.morebtn{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0}
.ex{display:flex;flex-direction:column}.ex .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.ex .r:first-child{border-top:0}.ex .r b{font-variant-numeric:tabular-nums;text-align:end}
.steps{display:flex;flex-direction:column;gap:12px;margin:6px 0 0;list-style:none;padding:0}.steps li{display:flex;align-items:center;gap:12px;opacity:.3;transition:opacity .4s}.steps li.on{opacity:1}
.steps .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}.steps li.on .ck{background:var(--ok);border-color:var(--ok)}.steps .ck svg{width:14px;height:14px;stroke:var(--bg);fill:none;stroke-width:3;opacity:0}.steps li.on .ck svg{opacity:1}
.sum{display:flex;flex-direction:column;padding:0;margin:0}.sum li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);list-style:none}.sum li:first-child{border-top:0}.sum b{font-family:var(--fd);flex:none;min-width:84px;color:var(--accent)}
.sent{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-top:30px}
/* الخطة المولَّدة */
.phead{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 12px;background:var(--plate);color:var(--fg)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:64px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 6px;text-align:center;font-weight:600;font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mealc{border:1px solid var(--line);background:var(--card);border-radius:22px;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--plate) 60%,transparent)}
.mh .tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13.5px;min-width:58px}.mh b{font-family:var(--fd);flex:1}.mh .kc{font-size:13px;color:var(--mut)}
.mh .fx{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:0 8px}
.ul{list-style:none;margin:0;padding:0}.ul>li{padding:10px 16px;border-top:1px solid var(--line)}.ul>li:first-child{border-top:0}
.ln{display:flex;align-items:center;gap:10px}.ln .lt{flex:1;min-width:0;line-height:1.5}
.ln .lv{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:0 8px;white-space:nowrap}
.ln .bkt{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:0 8px;white-space:nowrap}
.swp{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:36px;padding:0 10px;font-size:13px;font-weight:600;flex:none}
.swp.on{border-color:var(--accent);color:var(--accent)}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:8px}.alts button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;text-align:start;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.alts button:active{background:var(--accent-soft)}.alts .lv{font-size:11px;font-weight:700;color:var(--ok)}
.mealnote{padding:8px 16px;font-size:13px;color:var(--warn);background:var(--warn-soft)}
.toggle{display:flex;align-items:center;gap:12px;justify-content:space-between}
.sw2{width:52px;height:30px;border-radius:30px;background:var(--plate);border:1px solid var(--line);position:relative;flex:none;padding:0}.sw2::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 4px rgba(16,23,54,.3);transition:.2s}
.sw2.on{background:var(--accent)}.sw2.on::after{inset-inline-start:25px}

/* الدولة، الحد الأدنى، الانتظار، شاشة الأخصائي */
.ccs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-weight:600;text-align:start}
.cc span{font-size:22px}.cc.on{border-color:var(--accent);background:var(--accent-soft)}
.req{font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:1px 10px;margin-inline-start:auto;white-space:nowrap}.req.ok{color:var(--ok);background:var(--ok-soft)}
.sec h3{flex-wrap:wrap}.sugg{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:13.5px}.sugg[hidden]{display:none}
.hint{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px;margin:0}.hint.ok{color:var(--ok);background:var(--ok-soft)}
.scene{position:relative;width:260px;height:230px;margin:0 auto}
.scene .pl{position:absolute;inset:25px 40px auto 40px;animation:spin 24s linear infinite}
.scene .pl .wf{animation:wfill 9s ease-in-out infinite;transform:scale(0)}
@keyframes wfill{0%,8%{transform:scale(0)}20%,78%{transform:scale(1)}92%,100%{transform:scale(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.scene .orb{position:absolute;inset:0;animation:spin 14s linear infinite reverse}.scene .orb i{position:absolute;width:14px;height:14px;border-radius:50%}
.scene .fl2{position:absolute;border-radius:10px;animation:bob 3.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(8px) rotate(-4deg)}to{transform:translateY(-10px) rotate(5deg)}}
.cupw{position:absolute;inset-inline-start:6px;top:96px;width:34px;height:44px;border:3px solid var(--fg);border-top:0;border-radius:0 0 10px 10px;overflow:hidden;opacity:.85}.cupw i{position:absolute;inset:auto 0 0 0;background:var(--g-dairy);animation:cupfill 5s ease-in-out infinite}
@keyframes cupfill{0%{height:8%}60%,80%{height:86%}100%{height:8%}}
.pencil{position:absolute;inset-inline-end:2px;top:90px;width:12px;height:70px;border-radius:6px;background:linear-gradient(#ffc94d 75%,#ff7a59 75%);transform-origin:50% 100%;animation:wr 3s ease-in-out infinite alternate}
@keyframes wr{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.stg{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}.stg li{display:flex;align-items:center;gap:12px;opacity:.4;transition:opacity .4s}.stg li.on{opacity:1;font-weight:700}.stg li.pass{opacity:.75}
.stg .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}.stg li.pass .ck{background:var(--ok);border-color:var(--ok);color:var(--bg)}.stg li.on .ck{border-color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}}
.specbar{background:#101736;color:#fff}.tag.spec{background:#101736;color:#fff}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}.stepper button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:700}
.stepper b{font-family:var(--fd);font-size:34px;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.ta{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);color:var(--fg);font:inherit;resize:vertical}
.msg{background:var(--accent-soft);border-radius:16px;padding:12px 16px}.msg b{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.scene .pl,.scene .orb,.scene .pl .wf,.scene .fl2,.cupw i,.pencil{animation:none}.scene .pl .wf{transform:scale(1)}}
.frow{flex-direction:row;align-items:center;gap:12px}.frow b:first-of-type{flex:1;font-family:var(--fd)}.fic{font-size:28px}
.stepper2{display:flex;align-items:center;gap:10px}.stepper2 button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:700}.stepper2 b{min-width:28px;text-align:center;font-size:24px;font-variant-numeric:tabular-nums}
.intro{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:62vh;padding-top:8px}
.intro h1{font:700 32px/1.3 var(--fd);margin:18px 0 0;text-wrap:balance}
.in-skip{position:absolute;top:-6px;inset-inline-end:0;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:600 14px var(--fb)}
.in-dots{display:flex;gap:6px;justify-content:center;margin-top:44px}.in-dots i{width:22px;height:4px;border-radius:4px;background:var(--line)}.in-dots i.on{background:var(--accent);width:34px}.in-dots i.was{background:var(--accent-soft)}
.in-sub{color:var(--accent);font-weight:700;font-size:18px;margin:10px 0 0}
.in-ls{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;width:100%;align-items:center}
.in-l{min-height:1.7em;font-size:19px;color:var(--mut)}.in-l.p{font-size:20px;color:var(--fg);max-width:22ch;line-height:1.7}
.in-caret{display:inline-block;width:2px;height:1.1em;margin-inline-start:2px;vertical-align:-3px;background:var(--accent);animation:inblink .7s steps(1) infinite}
@keyframes inblink{50%{opacity:0}}

.intro.fin .in-punch,.intro.fin .in-art{opacity:1;transform:none}

.in-ic{font-size:22px}@keyframes incard{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
