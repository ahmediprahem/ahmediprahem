# موقع الأخصائيين hessanu: الأصول من public/ (يكتبها build_web.py، لا تُحفظ في git) + /api/lic (index.mjs)
# SITE_AUD يُضبط بعد إنشاء تطبيق Cloudflare Access ثانٍ لهذا العنوان؛ قبله يعمل الدخول القديم وحده.
name = "hessanu"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ACCESS_TEAM = "misty-scene-bff7"
SITE_AUD = "15aa2363df2a4007c3f0cf7394afc0cc8210d7e8e32317657dd2ae08d5b1b951"

[[d1_databases]]
binding = "ADB"
database_name = "zenha_admin"
database_id = "6711c840-e769-4f9c-92e5-177bbf6256e0"

[assets]
directory = "./public"
binding = "ASSETS"
