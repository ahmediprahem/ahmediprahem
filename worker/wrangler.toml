# إعداد النشر بسطر الأوامر (اختياري — يمكن النشر كله من لوحة Cloudflare بلا أوامر؛ انظر AI_SETUP_AR.md)
name = "dt-hamed-proxy"
main = "index.mjs"
compatibility_date = "2026-10-01"

# ربط Workers AI: لا يوجد أي مفتاح سري، الربط يتم داخل Cloudflare
[ai]
binding = "AI"

[vars]
# مفتاح التحقق العام للمدير (ليس سراً): انسخه من «إعدادات النظام ← 🤖 dt/hamed ← نسخ مفتاح التحقق العام» والصقه هنا بين علامتي اقتباس مفردتين
ADMIN_PUB = ''
